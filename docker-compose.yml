services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salescrm}
      POSTGRES_USER: ${POSTGRES_USER:-salespie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salespie123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salespie} -d ${POSTGRES_DB:-salescrm}"]
      interval: 10s
      timeout: 5s
      retries: 20


  salespie:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "192.168.1.94:8001:8001"
    environment:
      - DB_ENGINE=${DB_ENGINE:-postgres}
      - DB_NAME=${DB_NAME:-salescrm}
      - DB_USER=${DB_USER:-salespie}
      - DB_PASSWORD=${DB_PASSWORD:-salespie123}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./backend/media:/app/media
    restart: unless-stopped

volumes:
  postgres_data:
